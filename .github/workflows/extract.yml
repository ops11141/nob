name: Extract GEO DWG

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/GEO.dwg'

permissions:
  contents: write

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/extract-dwg.mjs
      - name: Commit extraction results
        run: |
          git config user.name "NOB Extractor"
          git config user.email "nob-extractor@users.noreply.github.com"
          git add data/decoded-summary.json data/equipment-candidates.json
          git diff --cached --quiet || git commit -m "Extract GEO DWG datasets"
          git push
