name: Extract GEO DWG

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/GEO.dwg'
      - 'source/GEO.dwg.gz'

permissions:
  contents: write

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore compressed DWG source
        run: |
          if [ -f source/GEO.dwg.gz ]; then
            gzip -dc source/GEO.dwg.gz > source/GEO.dwg
          fi
          test -s source/GEO.dwg

      - run: npm install

      - name: Decode and extract everything
        run: node scripts/extract-dwg.mjs

      - name: Upload complete raw extraction
        uses: actions/upload-artifact@v4
        with:
          name: nob-full-dwg-extraction
          path: data/raw-records.jsonl.gz
          if-no-files-found: error
          retention-days: 30

      - name: Commit indexes and QA summary
        run: |
          git config user.name "NOB Extractor"
          git config user.email "nob-extractor@users.noreply.github.com"
          git add data/decoded-summary.json data/dwg-objects.json data/model-entities.json data/layers.json data/linetypes.json data/equipment-candidates.json
          git diff --cached --quiet || git commit -m "Extract complete GEO DWG indexes"
          git push
