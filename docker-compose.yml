services:
  runner:
    build:
      context: ./runner
    container_name: nob-runner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: nob-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:80"
    depends_on:
      runner:
        condition: service_healthy
